name: Rebuild VBA source

on:
  push:
    paths:
      - 'src/.parts/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check all source chunks exist
        id: chunks
        shell: bash
        run: |
          missing=0
          for i in 1 2 3 4 5 6 7 8; do
            test -f "src/.parts/modBevelGear_${i}.b64" || missing=1
          done
          echo "ready=$((1-missing))" >> "$GITHUB_OUTPUT"

      - name: Rebuild modBevelGear.bas
        if: steps.chunks.outputs.ready == '1'
        shell: bash
        run: |
          cat src/.parts/modBevelGear_{1,2,3,4,5,6,7,8}.b64 | base64 -d > src/modBevelGear.bas

      - name: Commit rebuilt source
        if: steps.chunks.outputs.ready == '1'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modBevelGear.bas
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add bevel gear generator VBA source"
          git push
